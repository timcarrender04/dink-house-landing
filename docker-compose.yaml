# Coolify Docker Compose — Next.js landing.
# API calls go to dink-house-backend at https://api.thedinkhousepb.com.
#
# Coolify UI checklist:
# 1. Domain on service `web` only: https://thedinkhousepb.com:3000
# 2. Do NOT set a shared PORT env var
# 3. Uncheck "Available at Buildtime" for secrets
# 4. No custom networks: block — Coolify manages the stack network

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      BACKEND_URL: ${BACKEND_URL:-https://api.thedinkhousepb.com}
      DATABASE_URL: ${DATABASE_URL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://thedinkhousepb.com}
      SITE_URL: ${SITE_URL:-https://thedinkhousepb.com}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-5}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-50}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
